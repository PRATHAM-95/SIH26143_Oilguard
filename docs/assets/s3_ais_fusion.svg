<svg xmlns="http://www.w3.org/2000/svg" width="820" height="490" viewBox="0 0 820 490" font-family="Segoe UI, Arial, sans-serif">
  <rect width="820" height="490" fill="#ffffff"/>
  <!-- risk zone -->
  <rect x="235" y="150" width="350" height="200" rx="20" fill="#FEE2E2" opacity="0.85"/>
  <rect x="235" y="150" width="350" height="200" rx="20" fill="none" stroke="#DC2626" stroke-width="3" stroke-dasharray="12 8"/>
  <!-- vessel track -->
  <path d="M705,55 C540,130 435,175 335,203" fill="none" stroke="#0F172A" stroke-width="5"/>
  <path d="M335,203 C245,232 212,278 207,318" fill="none" stroke="#DC2626" stroke-width="5" stroke-dasharray="12 9"/>
  <path d="M207,318 C202,368 178,402 128,432" fill="none" stroke="#0F172A" stroke-width="5"/>
  <polygon points="118,438 148,428 136,414" fill="#0F172A"/>
  <!-- ship glyph -->
  <g transform="translate(700,28)">
    <polygon points="0,14 52,14 42,42 10,42" fill="#0F172A"/>
    <rect x="16" y="0" width="18" height="12" fill="#334155"/>
  </g>
  <!-- gap clocks -->
  <circle cx="335" cy="203" r="13" fill="#ffffff" stroke="#DC2626" stroke-width="3"/>
  <line x1="335" y1="203" x2="335" y2="194" stroke="#DC2626" stroke-width="2.5"/>
  <line x1="335" y1="203" x2="342" y2="206" stroke="#DC2626" stroke-width="2.5"/>
  <circle cx="207" cy="318" r="13" fill="#ffffff" stroke="#DC2626" stroke-width="3"/>
  <line x1="207" y1="318" x2="207" y2="309" stroke="#DC2626" stroke-width="2.5"/>
  <line x1="207" y1="318" x2="214" y2="321" stroke="#DC2626" stroke-width="2.5"/>
  <!-- score bars -->
  <rect x="60" y="432" width="256" height="15" rx="7" fill="#1E40AF"/>
  <text x="324" y="445" font-size="14" fill="#475569">proximity .40</text>
  <rect x="60" y="452" width="160" height="15" rx="7" fill="#0F766E"/>
  <text x="228" y="465" font-size="14" fill="#475569">trajectory .25</text>
  <rect x="330" y="432" width="128" height="15" rx="7" fill="#6D28D9"/>
  <text x="466" y="445" font-size="14" fill="#475569">dark-AIS .20</text>
  <rect x="330" y="452" width="102" height="15" rx="7" fill="#166534"/>
  <text x="440" y="465" font-size="14" fill="#475569">anomaly .15</text>
</svg>
